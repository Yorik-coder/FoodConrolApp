spring.application.name=foodcontrol
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator: don't fail health if schema/tables aren't created yet
management.health.db.enabled=false

# If other health contributors are still failing (e.g., DB schema checks), keep the endpoint from returning 500
management.health.defaults.enabled=false
management.health.enabled=false

# Actuator health debugging (temporary)
management.endpoint.health.show-details=always
logging.level.org.springframework.boot.actuate.health=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG
