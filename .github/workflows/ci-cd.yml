name: CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'foodcontrol/pom.xml'

      - name: Maven - package (skip tests)
        run: mvn -B -DskipTests package
        working-directory: foodcontrol

      - name: Maven - tests
        run: mvn -B test
        working-directory: foodcontrol

  docker_build_push:
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (SHA tag + latest on main)
        uses: docker/build-push-action@v6
        with:
          context: foodcontrol
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/foodcontrol:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/foodcontrol:latest

  deploy_heroku:
    needs: docker_build_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Heroku (container)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/foodcontrol:latest
        run: |
          echo "Deploying $IMAGE to Heroku app $HEROKU_APP_NAME"
          curl -sS -X PATCH "https://api.heroku.com/apps/${HEROKU_APP_NAME}/formation" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Content-Type: application/json" \
            -d "{\"updates\": [{\"type\": \"web\", \"docker_image\": \"${IMAGE}\"}]}" 

  healthcheck:
    needs: deploy_heroku
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Healthcheck
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          echo "Waiting for service..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Healthcheck passed"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed"
          exit 1
